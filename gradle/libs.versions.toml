[versions]
java = "21"
minecraft = "1.21.11"

# Fabric (mod)
loom = "1.15.4"
fabric-loader = "0.18.3"
fabric-api = "0.141.3+1.21.11"
carpet = "1.4.194"

# Paper (plugin)
paper = "1.21.11-R0.1-SNAPSHOT"
paperweight = "2.0.0-beta.21"

# Shared libraries
pathetic = "5.5.2"
voicechat = "2.6.20"

# Packet interceptors the dev servers run HeroBot alongside
protocollib = "dev-build"
packetevents = "2.13.0+spigot"

junit = "5.12.2"
junit-platform = "1.12.2"
netty = "4.2.7.Final"

jetbrains-annotations = "26.0.2-1"
slf4j = "2.0.16"
gson = "2.13.2"

# Build plugins resolved through build-logic
shadow = "9.6.1"
run-paper = "3.0.2"
plugin-yml = "0.9.0"

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
carpet = { group = "maven.modrinth", name = "carpet", version.ref = "carpet" }


pathetic-api = { group = "de.bsommerfeld.pathetic", name = "api", version.ref = "pathetic" }
pathetic-engine = { group = "de.bsommerfeld.pathetic", name = "engine", version.ref = "pathetic" }

voicechat-api = { group = "de.maxhenkel.voicechat", name = "voicechat-api", version.ref = "voicechat" }

jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrains-annotations" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
netty-transport = { group = "io.netty", name = "netty-transport", version.ref = "netty" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Plugin markers, consumed by build-logic so convention plugins can apply them by id
plugin-shadow = { group = "com.gradleup.shadow", name = "com.gradleup.shadow.gradle.plugin", version.ref = "shadow" }
plugin-run-paper = { group = "xyz.jpenilla.run-paper", name = "xyz.jpenilla.run-paper.gradle.plugin", version.ref = "run-paper" }
plugin-yml-paper = { group = "de.eldoria.plugin-yml.paper", name = "de.eldoria.plugin-yml.paper.gradle.plugin", version.ref = "plugin-yml" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
